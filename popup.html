<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 10px; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 5px; }
  textarea { height: 60px; resize: vertical; }
  button { margin-top: 10px; padding: 6px 14px; }
  .chk { font-weight: normal; display: flex; gap: 6px; align-items: flex-start; }
  .chk input { width: auto; margin-top: 2px; }
  #archiveNote, #contentNote, small { color: #666; }
  #url { color: #666; word-break: break-all; margin-top: 4px; }
  #status { margin-top: 8px; min-height: 1.2em; }
  #settings { float: right; margin-top: 14px; color: #666; text-decoration: none; }
  .ok { color: #0a7d2c; } .err { color: #c0201b; }
</style>
</head>
<body>
  <label for="title">Tytuł</label>
  <input id="title">
  <div id="url"></div>
  <label for="category">Kategoria (opcjonalnie)</label>
  <input id="category" placeholder="np. Zakładki">
  <label for="comment">Komentarz (opcjonalnie)</label>
  <textarea id="comment"></textarea>
  <label class="chk"><input type="checkbox" id="archive"> Zarchiwizuj w Wayback Machine i dodaj link <span id="archiveNote"></span></label>
  <label class="chk"><input type="checkbox" id="content"> <span>Dołącz treść strony (tekst, linki, tabele; bez obrazów) <span id="contentNote"></span><br><small>Zaznacz fragment na stronie, aby zapisać tylko jego.</small></span></label>
  <button id="save">Zapisz</button>
  <a href="#" id="settings">⚙ Ustawienia</a>
  <div id="status"></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
